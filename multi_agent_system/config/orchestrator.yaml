orchestrator:
  name: "Multi-Agent Orchestrator"
  version: "1.0.0"
  
shared_memory:
  type: knowledge_graph
  backend: sqlite
  
protocols:
  a2a:
    version: "1.0"
    message_bus: file_based
  mcp:
    version: "1.0"
    
agents:
  - id: trae-cn
    role: code_reviewer
  - id: codebuddy-cn
    role: code_writer
    
workflows:
  default:
    - name: convert_and_review
      steps:
        - task_type: convert
          assign_to: codebuddy-cn
        - task_type: review
          assign_to: trae-cn
          depends_on: previous
